<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار Antenatal Assessment</title>
<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#3b2a31;--mut:#8a7279;--pri:#d9688d;--acc:#e8899f;--ok:#4a9d73;--bad:#d0605a;--line:#f3dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191d;--card:#18262c;--ink:#e6eef1;--mut:#97aab2;--pri:#6cc3d5;--acc:#f08aa8;--ok:#58c28a;--bad:#ff8b82;--line:#2b3f47}}
:root[data-theme="dark"]{--bg:#10191d;--card:#18262c;--ink:#e6eef1;--mut:#97aab2;--pri:#6cc3d5;--acc:#f08aa8;--ok:#58c28a;--bad:#ff8b82;--line:#2b3f47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:1.6rem;margin:.4em 0 .2em;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 6px 20px rgba(217,104,141,.08);margin:12px 0}
.mut{color:var(--mut);font-size:.95rem}
button{font:inherit;cursor:pointer;border:1px solid var(--pri);background:var(--pri);color:var(--bg);border-radius:999px;padding:12px 20px}
button.ghost{background:transparent;color:var(--pri)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1;min-width:140px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin:8px 0}
.q{direction:ltr;text-align:left;font-size:1.15rem;font-weight:600;margin:14px 0}
.opts{display:grid;gap:8px;direction:ltr}
.opt{text-align:left;border-radius:16px;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.sel{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.big{font-size:3rem;font-weight:700;color:var(--acc);margin:0}
.rev{direction:ltr;text-align:left;border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}
.rev b{color:var(--bad)}.rev span{color:var(--ok)}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="home">
  <div style="text-align:center;font-size:3rem;margin-top:24px">💗</div>
  <h1>يلا نذاكر سوا</h1>
  <p class="mut" style="text-align:center">١٠٠ سؤال، وإنتِ أحلى ممرضة 🌸</p>
  <div class="card">
    <p id="best" class="mut" style="text-align:center"></p>
    <div class="row">
      <button id="bStudy">ابدئي يا قلبي</button>
      
    </div>
    <div class="row"><button id="bWrong" class="ghost hide">راجع أخطائي السابقة</button></div>
  </div>
</section>

<section id="quiz" class="hide">
  <div class="top"><span id="cnt"></span><span id="tm" class="hide"></span><span id="sc"></span></div>
  <div class="bar"><i id="pg"></i></div>
  <div class="card">
    <div class="q" id="qt"></div>
    <div class="opts" id="op"></div>
    <p id="fb" class="mut" style="text-align:center;margin:12px 0 0"></p>
    <div class="row"><button id="nx" class="hide">التالي</button></div>
  </div>
</section>

<section id="res" class="hide">
  <div class="card" style="text-align:center">
    <p class="big" id="pc"></p>
    <p id="msg"></p>
    <div class="row"><button id="again">اختبار جديد</button><button id="home2" class="ghost">الرئيسية</button></div>
  </div>
  <div class="card"><b>الإجابات الخاطئة</b><div id="rv"></div></div>
</section>
</main>
<script>
// صيغة: السؤال|أ|ب|ج|د|رقم الإجابة الصحيحة (0-3)
const D=`Antenatal assessment is:|Care after delivery|Routine evaluation of a pregnant woman to detect diseases or complications|Newborn examination|Family planning counseling|1
Visits for low-risk pregnancy in the first 6 months:|Weekly|Every 2 weeks|Every month|Every 3 months|2
Visits in the 7th and 8th months:|Every month|Every 2 weeks|Every week|Every 3 days|1
Visits in the 9th month:|Every month|Every 2 weeks|Every 2 days|Every week|3
Antenatal assessment consists of:|History, physical examination, lab investigation|History and ultrasound only|Lab only|Physical exam and ultrasound only|0
Which is NOT part of the history?|Personal information|Obstetrical history|Daily habits|Hemoglobin level|3
Personal information includes:|Hemoglobin|Name, age, address, phone|LMP|Fundal height|1
Duration of marriage is asked under:|Personal information|Family history|Interim history|Lab investigation|0
Source of income and housing condition are asked under:|Obstetrical history|Menstrual history|Personal information|Present pregnancy|2
Previous blood transfusion belongs to:|Medical and surgical history|Menstrual history|Interim history|Physical examination|0
Allergy from food or drug is asked under:|Family history|Medical and surgical history|Daily habits|Contraceptive history|1
Which belongs to medical and surgical history?|Tetanus immunization|Age of menarche|LMP|Number of children|0
STD is asked under:|Family history|Daily habits|Medical and surgical history|Menstrual history|2
Pelvic surgery or pelvic injury is asked under:|Medical and surgical history|Postpartum history|Present pregnancy|Interim history|0
Chronic illnesses asked about include:|Common cold|Headache|Heart disease, kidney disease, DM|Constipation|2
Family history asks about:|DM, hypertension, cardiac disease|Smoking|Fundal height|Blood group|0
Which is asked in family history?|Previous CS|Multiple pregnancy|Age of menarche|Contraceptive method|1
Family history also includes:|Congenital anomalies, allergy, asthma|Hair cleanliness|Gait|Weight|0
Obstetrical history includes:|Previous pregnancy, childbirth, postpartum|LMP only|Allergies only|Habits only|0
Previous pregnancy history includes:|Smoking and tea|Length, outcome, number, date of last abortion|Skin condition|Edema|1
Convulsion during pregnancy is asked under:|Neck examination|Lab investigation|Problems of each previous pregnancy|Extremities examination|2
Previous childbirth history includes:|Number of children, sex, live or stillborn|Age of menarche|Hemoglobin|Vital signs|0
Cesarean section and uterine surgery are asked under:|Menstrual history|Daily habits|Previous childbirth|Chest examination|2
Which is a postpartum problem?|Hair cleaning|Hemorrhage|Gait|Teeth condition|1
Postpartum problems include:|Cracked nipple, inverted nipple|Thyroid swelling|Varicose veins|Fundal height|0
Mastitis means:|Uterine infection|Breast inflammation|Cracked nipple only|Vaginal discharge|1
Daily habits include:|Work outside home, walking distance, heavy loads|LMP|Hemoglobin|Rh|0
Which is a daily habit?|Previous abortion|Blood group|Smoking, coffee or tea, alcohol|Hemoglobin|2
Hours of sleep and rest are asked under:|Family history|Daily habits and lifestyle|Lab investigation|Physical examination|1
Age of menarche means:|Age of first menstruation|Age of marriage|Age of menopause|Age at first delivery|0
Menstrual history includes:|Weight|Blood group|Fundal height|Duration, interval, amount of flow|3
LMP is used to calculate:|BMI|EDD|Hemoglobin|Blood pressure|1
EDD stands for:|Early Delivery Date|Estimated Disease Diagnosis|Expected Date of Delivery|Examination During Delivery|2
Contraceptive history includes:|Method, duration, reason for termination|Hb level|Edema|Fundal height|0
Present pregnancy history (first visit) includes:|Hair cleanliness|Gait|Symptoms, problems, baby movement, environmental hazards|Blood group|2
Environmental hazards in present pregnancy include:|Smoking and radiation|Sleep|Gait|Tea|0
About baby movement, we ask:|Only the last movement|Only the first movement|When baby first moved and last moved|Nothing|2
Interim history is taken at:|First visit|Return visit|Delivery|Postpartum|1
Present pregnancy history is taken at:|First visit|Return visit|Postpartum|Discharge|0
Interim history includes:|Religion|Any problems or changes since last visit|Family DM|Age of menarche|1
"Received care from another caregiver since last visit" is asked under:|Personal information|Interim history|Family history|Menstrual history|1
Asking if she changed her daily habits or lifestyle belongs to:|Interim history|Personal information|Family history|Obstetrical history|0
Physical examination includes:|History, lab, ultrasound|Head and neck only|General, abdominal, local|Blood and urine|2
General examination is done from:|Abdomen only|Head to toes|Chest only|Genitalia only|1
Observing general well-being includes:|Hemoglobin|Rh|Urine sugar|Gait, facial expression, general cleanliness|3
Skin should be free from:|Lesions and bruises|Pigment|Hair|Warmth|0
Measurements in general examination:|Hb and Rh|Blood sugar|Weight, height, vital signs|Fundal height only|2
Weight is recorded to know:|Blood group|Rate of weight gain during pregnancy|Rh status|EDD|1
Vital signs include:|Blood pressure, temperature, pulse, respiration|Weight and height|Hemoglobin|Urine tests|0
Hair is examined for:|Length|Color|Cleanliness|Thickness|2
The face is examined for:|Pallor or edema|Gait|Hemoglobin|Urine|0
Pigmentation on cheeks and forehead is evidence of:|Infection|Physiological changes of pregnancy|Cancer|Anemia|1
In the eye, we assess:|Color of iris|Degree of redness|Visual acuity|Eye pressure|1
In the mouth, we assess:|Tongue size|Tonsils|Condition of teeth and gums|Voice|2
Swelling and tenderness of the thyroid gland may indicate:|Infection or cancer|Pregnancy|Anemia|Edema|0
Chest examination (inside) includes:|Heart sounds, lung sounds, inspiration and expiration|Breast|Nipple|Areola|0
Chest examination (outside) includes:|Heart sounds|Lung sounds|Breast, nipple, areola|Expiration|2
Genitalia is examined by:|Percussion|Inspection and palpation|Auscultation|Ultrasound only|1
The first step in genital examination:|Insert finger into vagina|Check perineum|Check Bartholin gland|Separate labia majora with two fingers|3
Labia minora are checked for:|Fundal height|Hair|Nodules, clitoris, urethral opening, vaginal opening|Thyroid|2
Perineum is checked for:|Scars, inflammation, swelling, tenderness, ulcers, fistulas, discharge|Gait|Hair cleanliness|Heart sounds|0
Vaginal discharge is described by:|Weight|Color, amount, odor|Length|Temperature only|1
Bartholin gland is checked by:|Thumb|Inserting the index finger into the vagina|Speculum only|Ultrasound|1
Bartholin gland is checked for:|Scars|Pallor|Discharge and tenderness|Edema|2
Examination of extremities includes:|Color of palms and nails, finger swelling, shape and length of legs|Heart sounds|Fundal height|Urine sugar|0
Varicose veins means:|Edema|Bruises|Pallor|Dilated veins|3
Edema is checked in:|Legs, ankles, feet|Neck only|Eyes only|Abdomen only|0
Danger signs of pregnancy include:|Hair cleanliness|Pigmentation|Bleeding and absence of fetal movement|Gait|2
A woman reports absence of fetal movement. This is:|Normal|A danger sign|Edema|Pigmentation|1
Fundal height is measured from:|Pubic bone to top of uterus|Umbilicus to xiphoid|Sternum to umbilicus|Pubic bone to knee|0
At 12 weeks the fundus is:|At umbilicus|Just above pubic bone|Under sternum|Below xiphoid|1
At 20-24 weeks the fundus is:|At pubic bone|Under sternum|At umbilicus|Below the 38-week level|2
At 36-38 weeks the fundus is:|At pubic bone|At umbilicus|Just above pubic bone|Right under sternum|3
At 40 weeks (term) the fundus:|Is under sternum|Drops below the 38-week level|Is at umbilicus|Is just above pubic bone|1
The fundus drops at 40 weeks because:|The presenting part drops into the pelvis|Uterus shrinks|Amniotic fluid increases|Placenta moves up|0
At 14-16 weeks the fundus is:|Under sternum|At umbilicus|Between pubic bone and umbilicus|Below pubic bone|2
The highest fundal level is at:|12 weeks|20 weeks|24 weeks|36-38 weeks|3
Local examination is also called:|Chest examination|Neck examination|Breast examination|Vaginitis examination|3
Laboratory investigation includes:|Urine analysis and blood tests|Gait assessment|Skin examination|Hair assessment|0
Urine analysis in antenatal assessment looks for:|Hormones|Sugar and albumin|Calcium|Iron|1
Hemoglobin 10-12 is:|Normal|Refer to hospital|Needs iron twice daily|Needs admission|0
Hemoglobin 7-9: the woman is given:|Referral|Nothing|Iron-folate tablet twice daily|Anti-D|2
Hemoglobin less than 7:|Normal|Refer woman to hospital|Iron once weekly|Repeat next year|1
A woman with Hb 8 should receive:|Iron-folate twice daily|No treatment|Referral only|Anti-D|0
A woman with Hb 6 should:|Continue routine care|Take vitamins only|Take anti-D|Be referred to hospital|3
A woman with Hb 11 is:|Referred|Normal|Given iron twice daily|Given anti-D|1
Iron-folate tablet for mild anemia is given:|Once weekly|Twice daily|Four times daily|Not given|1
Blood tests include:|Blood group and Rh|Hair analysis|Skin biopsy|Urine culture only|0
If the woman is Rh negative, she should take:|Iron|Insulin|Anti-D immune globulin|Tetanus toxoid|2
An STD tested for in pregnancy is:|HIV|Asthma|Anemia|Edema|0
DM is tested for after:|12 weeks|28 weeks|8 weeks|40 weeks|1
Ultrasound looks at:|Fetus, uterus, amniotic fluid, placenta, pelvic|Hair|Skin|Teeth|0
Which is NOT assessed by ultrasound?|Fetus|Placenta|Amniotic fluid|Hair cleanliness|3
Anti-D immune globulin is given to:|Rh-negative woman|Rh-positive woman|All women|Diabetic women only|0
Nurse asks about number of children, stillbirth, cesarean section. This is:|Personal information|Family history|Previous childbirth history|Daily habits|2
A woman in her 7th month should visit:|Weekly|Every 2 weeks|Every month|Every 3 months|1
Fundus palpated just above the pubic bone. Gestational age is about:|12 weeks|20-24 weeks|36 weeks|40 weeks|0
A pregnant woman has Hb 7.5. The nurse should:|Do nothing|Refer to hospital|Give iron-folate twice daily|Give anti-D|2
Asking about smoking and radiation exposure belongs to:|Family history|Menstrual history|Interim history|Present pregnancy history|3
Which pair is correct?|First visit: present pregnancy; return visit: interim history|First visit: interim history; return visit: present pregnancy|Both: family history|Both: personal information|0`
.split("\n").map(l=>{const p=l.split("|");return{q:p[0],o:p.slice(1,5),a:+p[5]}});

const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S=null,timer=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function show(id){["home","quiz","res"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function home(){
  show("home");
  const b=store.get("aq_best");$("best").textContent=b?"أفضل نتيجة في وضع الامتحان: "+b+"%":"";
  let w=[];try{w=JSON.parse(store.get("aq_wrong")||"[]")}catch(e){}
  $("bWrong").classList.toggle("hide",!w.length);
}
function start(mode,n,idx){
  const list=(idx||sh(D.map((_,i)=>i))).slice(0,n||D.length).map(i=>{
    const d=D[i],c=d.o[d.a],o=sh(d.o);return{i,q:d.q,o,a:o.indexOf(c)}});
  S={mode,list,k:0,score:0,wrong:[],done:false,t:600};
  clearInterval(timer);$("tm").textContent="";$("tm").classList.toggle("hide",mode!=="exam");
  if(mode==="exam"){timer=setInterval(()=>{S.t--;$("tm").textContent=Math.floor(S.t/60)+":"+String(S.t%60).padStart(2,"0");if(S.t<=0)finish()},1000)}
  show("quiz");render();
}
function render(){
  const x=S.list[S.k];
  $("cnt").textContent=(S.k+1)+" / "+S.list.length;
  $("sc").textContent=S.mode==="study"?"صح: "+S.score:"";
  $("pg").style.width=(S.k/S.list.length*100)+"%";
  $("fb").textContent="";$("qt").textContent=x.q;$("nx").classList.add("hide");$("nx").textContent=S.k===S.list.length-1?"النتيجة":"التالي";
  const box=$("op");box.innerHTML="";
  x.o.forEach((t,j)=>{const b=document.createElement("button");b.className="opt";b.textContent="ABCD"[j]+") "+t;b.onclick=()=>pick(j);box.appendChild(b)});
}
function pick(j){
  const x=S.list[S.k],bs=[...$("op").children];
  if(j!==x.a)S.wrong.push({i:x.i,q:x.q,mine:x.o[j],right:x.o[x.a]});else S.score++;
  if(S.mode==="study"){
    bs.forEach((b,m)=>{b.disabled=true;if(m===x.a)b.classList.add("ok");else if(m===j)b.classList.add("bad")});
    const OK=["برافو عليكِ 💗","إنتِ شاطرة أوي 🌸","كده تمام يا دكتورة 💕","ممتاز! كمّلي 🌷"],NO=["مفيش مشكلة، كمّلي 💗","المرة الجاية تجيبيها 🌸","إنتِ قدها، ركّزي معايا 💕"];$("fb").textContent=(j===x.a?OK:NO)[Math.floor(Math.random()*(j===x.a?4:3))];$("sc").textContent="صح: "+S.score;$("nx").classList.remove("hide");$("nx").focus();
  }else next();
}
function next(){S.k++;S.k>=S.list.length?finish():render()}
function finish(){
  if(S.done)return;S.done=true;clearInterval(timer);
  const n=S.list.length,p=Math.round(S.score/n*100);
  $("pc").textContent=p+"%";
  $("msg").textContent="جاوبتي صح على "+S.score+" من "+n+(p>=85?" — ممتازة! فخور بيكِ 💗":p>=65?" — حلو أوي، راجعي الأخطاء وهتبقي ١٠٠٪ 🌸":" — مفيش مشكلة، نعيد تاني سوا 💕");
  if(S.mode==="exam"&&p>(+store.get("aq_best")||0))store.set("aq_best",p);
  let w=[];try{w=JSON.parse(store.get("aq_wrong")||"[]")}catch(e){}
  const ids=new Set(w);S.list.forEach(x=>ids.delete(x.i));S.wrong.forEach(x=>ids.add(x.i));
  store.set("aq_wrong",JSON.stringify([...ids]));
  const rv=$("rv");rv.innerHTML="";
  if(!S.wrong.length)rv.textContent="لا توجد أخطاء.";
  S.wrong.forEach(x=>{const d=document.createElement("div");d.className="rev";
    const q=document.createElement("div");q.textContent=x.q;
    const a=document.createElement("div");a.innerHTML="<b></b> ← <span></span>";
    a.firstChild.textContent=x.mine;a.lastChild.textContent=x.right;d.append(q,a);rv.appendChild(d)});
  show("res");
}
$("bStudy").onclick=()=>start("study",100);
$("bWrong").onclick=()=>{let w=[];try{w=JSON.parse(store.get("aq_wrong")||"[]")}catch(e){}start("study",w.length,sh(w))};
$("nx").onclick=next;
$("again").onclick=()=>start(S.mode,S.mode==="exam"?20:100);
$("home2").onclick=home;
home();
</script>
</body>
</html>
